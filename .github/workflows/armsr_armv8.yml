name: Build OpenWrt-25.12 for armsr_armv8

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 0 1,16 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_TAG: v25.12.6
  TZ: Asia/Shanghai
  CCACHE_DIR: ~/.ccache

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@main

      # 清盘：删除 runner 预装的 .NET / Android SDK / CodeQL / 数据库等无关组件，腾出约 10~15GB 空间，
      # 避免后续编译内核时磁盘写满（No space left on device）导致构建失败
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get remove -y '^llvm-*' '^mysql-*' '^mongodb-*' '^dotnet-*' || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h /

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update > /dev/null
          # 编译依赖固定在此，构建时不再访问外部清单
          sudo -E apt-get -qq install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd > /dev/null
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      # 跨构建保存 ccache 编译缓存：同一分支的重复构建可复用未改动源码的编译结果
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-openwrt-${{ github.ref }}
          restore-keys: |
            ccache-openwrt-${{ github.ref }}-
            ccache-openwrt-

      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone $REPO_URL --single-branch --depth=1 openwrt
          cd openwrt
          git fetch --depth=1 origin tag $REPO_TAG
          git checkout $REPO_TAG
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          echo "FILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV

      - name: Update & Install feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          bash $GITHUB_WORKSPACE/armsr/armv8/diy/diy.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load N1 custom config
        run: |
          rm -rf openwrt/files openwrt/.config
          mv armsr/armv8/N1/files armsr/armv8/N1/.config openwrt/
          chmod -R 755 openwrt

      - name: Download package
        working-directory: ./openwrt
        run: |
          make defconfig
          make download -j$(( $(nproc) * 2 ))

      - name: 安装 bpf-linker（honk 编译必需）
        run: |
          command -v zstd >/dev/null 2>&1 || sudo apt-get -qq install -y zstd
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL --retry 3 \
            "https://github.com/aya-rs/bpf-linker/releases/download/v0.13.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst" \
            -o "$HOME/bpf-linker.tar.zst"
          tar --zstd -xf "$HOME/bpf-linker.tar.zst" -C "$HOME/.cargo/bin"
          rm -f "$HOME/bpf-linker.tar.zst"
          chmod +x "$HOME/.cargo/bin/bpf-linker"
          "$HOME/.cargo/bin/bpf-linker" --version
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$GITHUB_ENV"

      - name: Compile N1 firmware
        working-directory: ./openwrt
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          ccache -M 5G
          ccache -z
          make -j$(( $(nproc) + 1 )) || make -j$((nproc)) V=s
          ccache -s

      - name: Package N1 firmware
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
          openwrt_board: s905d
          kernel_usage: stable
          openwrt_kernel: 6.12.y
          auto_kernel: 'true'
          openwrt_size: 256/1024
          builder_name: Mackol

      - name: Upload firmware to release
        run: |
          tag="OpenWrt_${{ github.ref_name }}_${{ env.FILE_DATE }}"
          gh release create $tag --repo ${{ github.repository }} --title "$tag" --notes "$(printf '首次使用建议全新刷写\n* 基本信息\nIP: 192.168.2.2\n账户: root\n密码: password')" 2> /dev/null || true
          gh release upload $tag ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz --repo ${{ github.repository }} --clobber

      - name: Delete old releases
        run: |
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[].tagName' | tail -n +11 | while read -r tag; do gh release delete "$tag" --repo ${{ github.repository }} --cleanup-tag --yes; done
